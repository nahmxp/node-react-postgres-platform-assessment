server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Lightweight health endpoint for Docker/k8s probes.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Same-origin API proxy: the browser only ever talks to this nginx, which
    # forwards /api/* to the backend over the internal network. Upstream is
    # injected from the BACKEND_UPSTREAM env var (envsubst template).
    location /api/ {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
