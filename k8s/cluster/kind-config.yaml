# kind cluster with host ports 80/443 mapped to the ingress-nginx controller.
#   kind create cluster --name node-react --config k8s/cluster/kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      - containerPort: 30080   # frontend NodePort (Task 2, before Ingress)
        hostPort: 30080
        protocol: TCP
