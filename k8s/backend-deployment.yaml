apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dev
  labels:
    app: backend
    tier: api
spec:
  replicas: 2
  revisionHistoryLimit: 10        # keeps old ReplicaSets for `kubectl rollout undo`
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0           # zero-downtime: a new pod must be Ready first
      maxSurge: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        tier: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: backend
          # CI rewrites the tag to <branch>-<short-sha>; locally the image is
          # built and loaded into kind by scripts/kind-up.sh.
          image: ghcr.io/nahmxp/node-react-postgres-platform-assessment-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: app-secrets, key: DB_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secrets, key: DB_PASSWORD }
            # $(VAR) expansion builds the URLs from the secret at runtime, so
            # credentials never appear in the ConfigMap.
            - name: DB_WRITE_URL
              value: postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_WRITE_HOST):$(DB_PORT)/$(DB_NAME)
            - name: DB_READ_URL
              value: postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_READ_HOST):$(DB_PORT)/$(DB_NAME)
          # Startup: the API retries the DB for up to ~60s before listening.
          startupProbe:
            httpGet: { path: /api/health/live, port: http }
            periodSeconds: 5
            failureThreshold: 24
          # Readiness = "can I serve traffic?" (checks the DB). A failing pod is
          # removed from the Service endpoints but NOT restarted.
          readinessProbe:
            httpGet: { path: /api/health/ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          # Liveness = "is the process wedged?" (no dependency checks), so a DB
          # outage does not cause a restart storm.
          livenessProbe:
            httpGet: { path: /api/health/live, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
