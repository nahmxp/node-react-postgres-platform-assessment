# API gateway for the dev namespace (ingress-nginx).
#   http://node-react.local/        -> frontend-service:80
#   http://node-react.local/api/... -> backend-service:4000
# Rate limiting is enforced here, at the edge, before traffic reaches any pod
# (limits explained in README, Task 6).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: node-react-ingress
  namespace: dev
  labels:
    app.kubernetes.io/part-of: node-react-platform
  annotations:
    # ~20 req/s per client IP with a burst of 5x (=100) for page loads.
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  rules:
    - host: node-react.local
      http:
        paths:
          # More specific prefix wins: /api and /api/* go to the backend.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
