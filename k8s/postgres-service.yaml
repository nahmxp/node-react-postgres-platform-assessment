# Internal only (ClusterIP): postgres-service.dev.svc.cluster.local:5432
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: dev
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
