# DEV-ONLY credentials for the local kind cluster.
# - stringData keeps the file readable; Kubernetes stores it base64 encoded.
# - CI does NOT apply this file: the pipeline creates the Secret from
#   encrypted GitHub Actions secrets instead (see .github/workflows/ci-cd.yml).
# - For real environments use Sealed Secrets / External Secrets / SOPS.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: dev
  labels:
    app.kubernetes.io/part-of: node-react-platform
type: Opaque
stringData:
  DB_USER: "appuser"
  DB_PASSWORD: "dev-only-change-me"
